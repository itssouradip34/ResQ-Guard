version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: resq_guard_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./resq_guard.db
      - OFFLINE_MODE=True
      - MOCK_CAMERA_STREAMS=True
    volumes:
      - ./sample_data:/app/sample_data
      - backend_data:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resq_guard_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
